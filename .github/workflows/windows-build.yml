name: EVILWARE The Unholy Core 3 Windows x64 Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read

# Keep only the newest main-branch validation run active.
concurrency:
  group: evilware-windows-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for original asset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/Release/EVILWARE.exe"
          windeployqt --release --compiler-runtime "$exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/*" dist -Recurse -Force
          Copy-Item README.md dist/README.md -Force
          Copy-Item ROADMAP.md dist/ROADMAP.md -Force
          Copy-Item TESTING.md dist/TESTING.md -Force
          Copy-Item BUILD.md dist/BUILD.md -Force
          Copy-Item INSTALLATION.md dist/INSTALLATION.md -Force
          Copy-Item SECURITY.md dist/SECURITY.md -Force
          Copy-Item docs dist/docs -Recurse -Force
      - name: Run headless workspace smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $test = Start-Process -FilePath "build/Release/EVILWARE.exe" -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "EVILWARE smoke test exit code: $($test.ExitCode)"
          if ($test.ExitCode -ne 0) { throw "EVILWARE workspace smoke test failed with exit code $($test.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/NEXUS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Package portable ZIP
        run: Compress-Archive -Path dist/* -DestinationPath EVILWARE-Unholy-Core-3-Windows-x64-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EVILWARE-Unholy-Core-3-Windows-x64
          path: |
            installer-output/EVILWARE-Unholy-Core-3-x64.exe
            EVILWARE-Unholy-Core-3-Windows-x64-Portable.zip
          if-no-files-found: error
