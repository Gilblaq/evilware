name: EVILWARE The Unholy Core 3 Windows x64 Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/Release/EVILWARE.exe"
          windeployqt --release --compiler-runtime "$exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/*" dist -Recurse -Force
          Copy-Item README.md dist/README.md -Force
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/NEXUS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Package portable ZIP
        run: Compress-Archive -Path dist/* -DestinationPath EVILWARE-Unholy-Core-3-Windows-x64-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EVILWARE-Unholy-Core-3-Windows-x64
          path: |
            installer-output/EVILWARE-Unholy-Core-3-x64.exe
            EVILWARE-Unholy-Core-3-Windows-x64-Portable.zip
          if-no-files-found: error
